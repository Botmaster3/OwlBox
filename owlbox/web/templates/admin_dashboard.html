{% extends "base.html" %}
{% block title %}OwlBox – Jetzt läuft{% endblock %}
{% block body %}
<div class="admin" id="app">
  {% include "_admin_nav.html" %}

  <div class="card now-playing" id="now-playing">
    <div class="now-playing-cover" id="np-cover-wrap">
      <img id="np-cover" alt="" hidden>
      <div id="np-cover-placeholder" class="now-playing-placeholder">🦉</div>
    </div>
    <div class="now-playing-info">
      <div class="now-playing-eyebrow">Jetzt läuft</div>
      <div class="now-playing-title" id="np-title">Kein Chip aufgelegt</div>
      <div class="now-playing-track" id="np-track" hidden></div>
      <div class="vu-meter" id="np-vu-meter">
        <div class="vu-bar"></div>
        <div class="vu-bar"></div>
        <div class="vu-bar"></div>
        <div class="vu-bar"></div>
        <div class="vu-bar"></div>
      </div>
      <div id="np-progress-row" class="progress-row">
        <span id="np-time-pos" class="time">0:00</span>
        <div class="progress-bar"><div id="np-progress-fill" class="progress-fill"></div></div>
        <span id="np-time-dur" class="time">0:00</span>
      </div>
      <div class="volume-row wifi-row">
        <span>📶</span>
        <div class="progress-bar"><div id="np-wifi-fill" class="progress-fill"></div></div>
        <span id="np-wifi-label">–</span>
      </div>
      <div id="np-sleep-timer-badge" class="sleep-timer-badge" hidden>
        😴 Einschlaf-Timer: <span id="np-sleep-timer-remaining"></span>
      </div>
      <div id="np-upcoming" class="np-upcoming" hidden>
        <div class="np-upcoming-label">Als Nächstes</div>
        <ol id="np-upcoming-list" class="np-upcoming-list"></ol>
      </div>
      <div class="control-buttons">
        <button class="btn secondary" id="np-btn-prev" type="button">⏮ Zurück</button>
        <button class="btn secondary" id="np-btn-toggle" type="button">⏯ Play/Pause</button>
        <button class="btn secondary" id="np-btn-next" type="button">⏭ Weiter</button>
      </div>
      <div class="field">
        <label for="np-volume">Lautstärke (<span id="np-volume-value">–</span>%)</label>
        <input type="range" id="np-volume" min="0" max="100" value="60">
      </div>
      <div class="field">
        <label for="np-brightness">Helligkeit (<span id="np-brightness-value">–</span>%)</label>
        <input type="range" id="np-brightness" min="0" max="100" value="100">
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>
{% endblock %}
