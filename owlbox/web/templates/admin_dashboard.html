{% extends "base.html" %}
{% block title %}OwlBox – Jetzt läuft{% endblock %}
{% block body %}
<div class="admin" id="app">
  {% include "_admin_nav.html" %}

  <div class="card now-playing" id="now-playing">
    <div class="now-playing-cover" id="np-cover-wrap">
      <img id="np-cover" alt="" hidden>
      <div id="np-cover-placeholder" class="now-playing-placeholder">🦉</div>
    </div>
    <div class="now-playing-info">
      <div class="now-playing-eyebrow">Jetzt läuft</div>
      <div class="now-playing-title" id="np-title">Kein Chip aufgelegt</div>
      <div class="now-playing-track" id="np-track" hidden></div>
      <div class="progress-row">
        <span id="np-time-pos" class="time">0:00</span>
        <div class="progress-bar"><div id="np-progress-fill" class="progress-fill"></div></div>
        <span id="np-time-dur" class="time">0:00</span>
      </div>
      <div class="volume-row">
        <span>🔉</span>
        <div class="progress-bar"><div id="np-volume-fill" class="progress-fill volume-fill"></div></div>
        <span>🔊</span>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>
{% endblock %}
