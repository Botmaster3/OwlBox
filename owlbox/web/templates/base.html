<!doctype html>
<html lang="de" data-theme="{{ theme }}" data-advent-candles="{{ advent_candles }}" data-christmas-eve="{{ 'true' if christmas_eve else 'false' }}"{% if custom_theme_style %} style="{{ custom_theme_style }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}OwlBox{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <script>
    if (localStorage.getItem("owlbox-help-mode") === "1") {
      document.body.classList.add("help-mode");
    }
  </script>
  {% block body %}{% endblock %}
</body>
</html>
