<!doctype html>
<!--
  Standalone boot-loading screen for the kiosk - see scripts/kiosk.sh, which
  points Chromium at this file (via file://, no web server needed yet)
  instead of silently waiting in a bash curl-loop before launching Chromium
  at all. That left the display dead/backlit-only for however long
  owlbox.service took to come up, with zero feedback. This page shows a
  progress bar immediately, works with no backend running (plain local
  file), and navigates itself to the real app the moment /api/state
  actually responds.

  No build step, no external assets (fonts/CSS/JS all inline or system) -
  has to render correctly from a bare file:// open, same constraint as
  everything else this project ships to the kiosk.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OwlBox – wird gestartet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #12141c;
    color: #f5f2ea;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
  }
  .owl { font-size: 20vh; line-height: 1; }
  .name { font-size: 6vh; font-weight: 700; letter-spacing: 0.02em; }
  .status { font-size: 2.6vh; color: #9a9db0; min-height: 1.4em; }
  .bar-track {
    width: 60vw;
    max-width: 420px;
    height: 10px;
    border-radius: 999px;
    background: #1c2030;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #f2a93c;
    transition: width 0.25s ease-out;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="owl">🦉</div>
  <div class="name">OwlBox</div>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  <div class="status" id="status">Wird gestartet…</div>
</div>
<script>
(function () {
  var TARGET_URL = "http://localhost:5000/";
  var STATE_URL = "http://localhost:5000/api/state";
  var bar = document.getElementById("bar");
  var statusEl = document.getElementById("status");
  var startTime = Date.now();
  // Not tied to real boot-stage completion (nothing on this static page
  // could know that) - eases toward ~92% over roughly 20s, same trick
  // most OS boot progress bars use: fast at first, slowing down, never
  // quite finishing until the real thing is confirmed ready. Once /api/state
  // actually answers, jumps straight to 100% and navigates away.
  var ready = false;

  function updateFakeProgress() {
    if (ready) return;
    var elapsedSeconds = (Date.now() - startTime) / 1000;
    var progress = 92 * (1 - Math.exp(-elapsedSeconds / 8));
    bar.style.width = progress.toFixed(1) + "%";
    if (elapsedSeconds > 25) {
      statusEl.textContent = "Dauert länger als sonst…";
    }
    requestAnimationFrame(updateFakeProgress);
  }
  requestAnimationFrame(updateFakeProgress);

  function pollBackend() {
    if (ready) return;
    // mode:"no-cors" so this works with zero CORS setup on the Flask side -
    // the response body/status can't be read this way, but that's fine,
    // all that matters here is whether the request itself succeeded
    // (server accepting connections) or failed (not up yet).
    fetch(STATE_URL, { mode: "no-cors", cache: "no-store" })
      .then(function () {
        ready = true;
        bar.style.width = "100%";
        statusEl.textContent = "Bereit";
        setTimeout(function () {
          window.location.href = TARGET_URL;
        }, 250);
      })
      .catch(function () {
        setTimeout(pollBackend, 700);
      });
  }
  pollBackend();
})();
</script>
</body>
</html>
